name: First-user Windows a16 review
on:
  push:
    branches:
      - 'qa/first-user-*'
permissions:
  contents: read
jobs:
  release-consumer:
    runs-on: windows-2022
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check hosted Windows and choose a volume for the pinned checkpoint
        run: |
          $minimum = 14618145824 + 3GB + 256MB
          $drives = [IO.DriveInfo]::GetDrives() | Where-Object {
            $_.Name -in @('C:\', 'D:\') -and $_.IsReady -and $_.DriveType -eq 'Fixed'
          }
          foreach ($drive in $drives) {
            Write-Host ('Volume {0} has {1:N2} GiB available' -f $drive.Name[0], ($drive.AvailableFreeSpace / 1GB))
          }
          $volume = $drives | Where-Object AvailableFreeSpace -ge $minimum |
            Sort-Object AvailableFreeSpace -Descending | Select-Object -First 1
          if (!$volume) { throw 'Neither C nor D has space for the 14.6 GB checkpoint, downloader reserve and setup margin.' }
          if (![Environment]::Is64BitOperatingSystem) { throw 'Windows x64 is required.' }
          $root = New-Item -ItemType Directory -Path (Join-Path $volume.RootDirectory.FullName "bovary-review-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")
          "BOVARY_TRIAL_ROOT=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host ('Windows version {0}, available processors {1}' -f [Environment]::OSVersion.Version, [Environment]::ProcessorCount)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Fetch the exact private prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.2.0a16 --repo $env:GITHUB_REPOSITORY --dir $env:BOVARY_TRIAL_ROOT `
            --pattern bovary-0.2.0a16-cpu-review.zip --pattern bovary-0.2.0a16-py3-none-any.whl --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Private prerelease download failed.' }
      - name: Compare reviewed hashes and follow the README package install
        run: |
          Set-Location -LiteralPath $env:BOVARY_TRIAL_ROOT
          $expected = @{
            'bovary-0.2.0a16-cpu-review.zip' = '5b5d666bff2d68f5a52f10f608b168c2dbdac5bf92c74271ea068e3f81b5157a'
            'bovary-0.2.0a16-py3-none-any.whl' = '439db05d1dfccdf651ad7dce5f7f55f6ca0663f63001826e1dbcf35b475225af'
          }
          $manifest = Get-Content -LiteralPath SHA256SUMS.txt
          foreach ($name in $expected.Keys) {
            $record = @($manifest | Where-Object { $_ -match ('^[0-9a-fA-F]{64}\s+\*?' + [regex]::Escape($name) + '$') })
            $actual = (Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($record.Count -ne 1 -or $record[0].Substring(0, 64) -ne $expected[$name] -or $actual -ne $expected[$name]) {
              throw "Reviewed SHA256 mismatch for $name."
            }
            Write-Host "$name SHA256 $actual"
          }
          Expand-Archive .\bovary-0.2.0a16-cpu-review.zip -DestinationPath .\runtime
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'Could not create a fresh venv.' }
          .\.venv\Scripts\python.exe -m pip install --no-index --no-deps .\bovary-0.2.0a16-py3-none-any.whl
          if ($LASTEXITCODE -ne 0) { throw 'Wheel installation failed.' }
          .\.venv\Scripts\python.exe -c "import tkinter; print('Python Tk version', tkinter.TkVersion)"
          if ($LASTEXITCODE -ne 0) { throw 'Python Tk import failed.' }
      - name: Obtain and verify the public pinned checkpoint
        run: |
          Set-Location -LiteralPath $env:BOVARY_TRIAL_ROOT
          $PSNativeCommandUseErrorActionPreference = $false
          $env:BOVARY_HOME = (Resolve-Path .\runtime).Path
          $modelDir = Join-Path $env:BOVARY_HOME 'work\models'
          $env:BOVARY_MODEL = Join-Path $modelDir 'gemma-4-26B-A4B-it-Q4_0.gguf'
          $env:BOVARY_MODEL_MANIFEST = Join-Path $modelDir 'model-provenance.json'
          $downloadLog = Join-Path $env:BOVARY_TRIAL_ROOT 'checkpoint-download.log'
          .\.venv\Scripts\python.exe .\runtime\tools\download_model.py --directory $modelDir *> $downloadLog
          if ($LASTEXITCODE -ne 0) {
            $lastProgress = Get-Content -LiteralPath $downloadLog | Select-String '^\{"downloaded": \d+, "total": \d+\}$' | Select-Object -Last 1
            if ($lastProgress) { Write-Host $lastProgress.Line }
            $failure = Get-Content -LiteralPath $downloadLog | Select-String -AllMatches '\bHTTP Error (\d{3})\b' | Select-Object -Last 1
            if ($failure) { Write-Host "Checkpoint HTTP error $($failure.Matches[0].Groups[1].Value)" }
            throw 'Pinned checkpoint download or downloader verification failed.'
          }
          $verify = .\.venv\Scripts\python.exe .\runtime\tools\verify_model.py --model $env:BOVARY_MODEL --manifest $env:BOVARY_MODEL_MANIFEST 2> $null
          if ($LASTEXITCODE -ne 0) { throw 'README checkpoint verification failed.' }
          $proof = ($verify -join "`n") | ConvertFrom-Json
          if ($proof.sha256 -ne 'd208665ab1cd3a69f7a9a4bc59430e8448c8093d9b06334f566ac59d6d504a03') {
            throw 'README verifier returned an unexpected model identity.'
          }
          Write-Host "Checkpoint verified with SHA256 $($proof.sha256)."
          @("BOVARY_HOME=$env:BOVARY_HOME", "BOVARY_MODEL=$env:BOVARY_MODEL", "BOVARY_MODEL_MANIFEST=$env:BOVARY_MODEL_MANIFEST") |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run doctor, Mini arithmetic and slow CPU checklist
        run: |
          Set-Location -LiteralPath $env:BOVARY_TRIAL_ROOT
          $PSNativeCommandUseErrorActionPreference = $false
          $exe = '.\.venv\Scripts\bovary.exe'
          $doctorText = & $exe doctor --json 2> $null
          $doctorExit = $LASTEXITCODE
          $doctor = $doctorText | ConvertFrom-Json
          $doctor.checks | Select-Object id, status | Format-Table | Out-String | Write-Host
          if ($doctorExit -ne 0 -or $doctor.exit_code -ne 0) { throw 'Doctor found a required setup failure.' }

          $timer = [Diagnostics.Stopwatch]::StartNew()
          $arithmetic = & $exe mini --prompt 'What is 17 plus 28? Answer with just the number.' 2> $null
          $arithmeticExit = $LASTEXITCODE
          $timer.Stop()
          if ($arithmeticExit -ne 0 -or ($arithmetic -join "`n").Trim() -ne '45') {
            throw "README arithmetic failed (exit $arithmeticExit)."
          }
          Write-Host ('README arithmetic: 45 ({0:N2} seconds wall-clock)' -f $timer.Elapsed.TotalSeconds)

          $prompt = 'Turn this school fair planning note into a short checklist. Keep each owner and deadline. Mark the undecided item as open. Do not invent details. Note: Sam will book the hall by Tuesday. Lee offered to print the posters by Friday. We still need someone to bring the folding tables.'
          $stderr = Join-Path $env:BOVARY_TRIAL_ROOT 'checklist-stderr.log'
          $timer.Restart()
          $answer = & $exe --mode local --offline --preset cpu-only --threads 2 --context 2048 --tokens 128 --deadline-s 1200 --json --prompt $prompt 2> $stderr
          $checklistExit = $LASTEXITCODE
          $timer.Stop()
          $row = ($answer -join "`n") | ConvertFrom-Json -ErrorAction SilentlyContinue
          if ($checklistExit -ne 0 -or $row.status -ne 'complete') {
            $failure = $row
            if (!$failure) {
              $failure = Get-Content -LiteralPath $stderr | Select-Object -Last 1 | ConvertFrom-Json -ErrorAction SilentlyContinue
            }
            $status = [string]$failure.status
            $code = [string]$failure.error.code
            if ($status -notmatch '^[a-z][a-z_]{0,39}$') { $status = 'unavailable' }
            if ($code -notmatch '^[a-z][a-z_]{0,63}$') { $code = 'unavailable' }
            if ($row.text) { Write-Host $row.text }
            throw ('Offline CPU checklist failed (exit {0}, status {1}, error {2}, wall {3:N2} s).' -f
              $checklistExit, $status, $code, $timer.Elapsed.TotalSeconds)
          }
          $attempt = @($row.attempts)
          if ($row.destination -ne 'local' -or $attempt.Count -ne 1 -or $attempt[0].destination -ne 'local' -or
              $attempt[0].status -ne 'complete' -or $attempt[0].timing.warm -ne $false -or
              $row.usage.input_tokens -le 0 -or $row.usage.output_tokens -le 0 -or $row.usage.output_tokens -ge 128 -or
              $row.usage.finish_reason -ne 'eos' -or $row.timing.end_to_end_s -le 0 -or [string]::IsNullOrWhiteSpace($row.text)) {
            throw 'Offline CPU checklist returned unexpected attempt, usage or timing data.'
          }
          Write-Host ('Offline CPU checklist ({0:N2} s wall, {1:N2} s reported, {2} output tokens, one cold local worker):' -f
            $timer.Elapsed.TotalSeconds, $row.timing.end_to_end_s, $row.usage.output_tokens)
          Write-Host $row.text
          $lines = @($row.text -split '\r?\n' | Where-Object { $_ -match '^\s*(?:[-*+]|\d+[.)])\s+' })
          $hall = @($lines | Where-Object { $_ -match '\bhall\b' })
          $posters = @($lines | Where-Object { $_ -match '\bposters\b' })
          $tables = @($lines | Where-Object { $_ -match '\bfolding tables\b' })
          if ($lines.Count -ne 3 -or $hall.Count -ne 1 -or $hall[0] -notmatch '\bSam\b' -or $hall[0] -notmatch '\bTuesday\b' -or
              $posters.Count -ne 1 -or $posters[0] -notmatch '\bLee\b' -or $posters[0] -notmatch '\bFriday\b' -or
              $tables.Count -ne 1 -or $tables[0] -notmatch '\b(open|unassigned|undecided)\b' -or
              $tables[0] -match '\b(Sam|Lee|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\b') {
            throw 'Checklist failed the item, owner, deadline or open-item checks.'
          }
          Write-Host 'Checklist structure and expected values passed; review the synthetic text for invented details.'
