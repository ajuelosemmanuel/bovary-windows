name: CPU and fake-provider checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows-cpu:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PYTHONPATH: python
      BOVARY_LIVE_API: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use canonical same-volume temporary paths
        shell: pwsh
        run: |
          # Hosted TEMP can use an 8.3 alias and live on a different drive than the checkout.
          # Keep fixture directories outside the Git checkout for standalone Git tests.
          $tempDir = (New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'bovary-ci-temp') -Force).FullName
          $tempDir = (Resolve-Path -LiteralPath $tempDir).Path
          if ([IO.Path]::GetPathRoot($tempDir) -ne [IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)) {
            throw 'Test temporary directory must share the checkout volume'
          }
          @("TEMP=$tempDir", "TMP=$tempDir") | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pip install --no-index --no-deps --no-build-isolation -e .
      - run: python scripts/prepare_release.py --check --check-tracked
      - run: python scripts/check_distribution.py
      - run: python scripts/bootstrap_engine.py
      - run: python scripts/bootstrap_engine.py --check
      - name: Build CPU and path-test fixture
        shell: cmd
        run: scripts\build.cmd cpu 2 test-paths
      - name: No-model CPU and protocol-2 smoke
        shell: pwsh
        run: |
          $result = & .\work\build\bovary-cpu\bovary-infer.exe 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1 -or $result -notmatch 'invalid arguments') { throw 'CPU smoke failed' }
          $protocol = & .\work\build\bovary-cpu\bovary-infer.exe --require-cpu-only --protocol-version
          if ($LASTEXITCODE -ne 0 -or $protocol.Trim() -ne 'bovary-worker 2') { throw 'Native protocol mismatch' }
      - name: Run full suite with native CPU and Unicode fixtures
        shell: pwsh
        run: |
          $env:BOVARY_TEST_NATIVE_DIR = (Resolve-Path -LiteralPath work/build/bovary-cpu).Path
          foreach ($name in 'bovary-infer.exe','bovary-quantize.exe','bovary-paths-test.exe') {
            if (!(Test-Path -LiteralPath (Join-Path $env:BOVARY_TEST_NATIVE_DIR $name) -PathType Leaf)) {
              throw "Missing CPU test fixture $name"
            }
          }
          # The build cache supplies Ninja when it is absent from the step's PATH.
          $ninja = (Select-String -LiteralPath work/build/bovary-cpu/CMakeCache.txt -Pattern '^CMAKE_MAKE_PROGRAM:[^=]+=(.+)$').Matches.Groups[1].Value
          if (!(Get-Command ninja -ErrorAction SilentlyContinue) -and (!$ninja -or !(Test-Path -LiteralPath $ninja -PathType Leaf))) {
            throw 'Ninja is required for the build-freshness regression'
          }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Full test suite failed' }
      - name: Run Inkling preview tests without models
        run: python -m unittest discover -s previews/inkling -p test_preview.py -v
      - name: Validate model-choice launcher packaging without models
        run: python -m unittest discover -s launcher -v
      - name: Build wheel
        run: python -m pip wheel --no-index --no-deps --no-build-isolation . --wheel-dir dist
      - name: Verify actual wheel and isolated installed behavior
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem -LiteralPath dist -Filter *.whl)
          if ($wheels.Count -ne 1) { throw 'Expected one built wheel' }
          python scripts/prepare_release.py --check-wheel $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Wheel structure/source/RECORD check failed' }
          python scripts/check_installed.py --wheel $wheels[0].FullName --native work/build/bovary-cpu/bovary-infer.exe --work-dir work/ci-installed-check --output outputs/ci-installed-check.json
          if ($LASTEXITCODE -ne 0) { throw 'Isolated installed check failed' }
      - name: Build and verify complete source distribution
        shell: pwsh
        run: |
          python -c "from setuptools.build_meta import build_sdist; build_sdist('dist')"
          if ($LASTEXITCODE -ne 0) { throw 'Source distribution build failed' }
          $archives = @(Get-ChildItem -LiteralPath dist -Filter *.tar.gz)
          if ($archives.Count -ne 1) { throw 'Expected one source distribution' }
          python scripts/check_distribution.py --sdist $archives[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Source distribution boundary check failed' }
      - name: Rebuild and check wheel from the emitted source distribution
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath dist -Filter *.tar.gz)
          if ($archives.Count -ne 1) { throw 'Expected one source distribution' }
          python scripts/check_distribution.py --sdist $archives[0].FullName --extract-to work/ci-sdist-source
          if ($LASTEXITCODE -ne 0) { throw 'Checked source extraction failed' }
          $source = (Resolve-Path -LiteralPath work/ci-sdist-source).Path
          $rebuilt = (New-Item -ItemType Directory -Path work/ci-sdist-wheel).FullName
          Remove-Item Env:PYTHONPATH,Env:PYTHONHOME -ErrorAction SilentlyContinue
          Push-Location -LiteralPath $source
          try {
            python -I -m pip wheel --no-index --no-deps --no-build-isolation --no-cache-dir . --wheel-dir $rebuilt
            if ($LASTEXITCODE -ne 0) { throw 'Source-distribution wheel rebuild failed' }
          } finally { Pop-Location }
          $wheels = @(Get-ChildItem -LiteralPath $rebuilt -Filter *.whl)
          if ($wheels.Count -ne 1) { throw 'Expected one rebuilt wheel' }
          python scripts/prepare_release.py --check-wheel $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Rebuilt wheel structure/source/metadata/RECORD check failed' }
          python scripts/check_installed.py --wheel $wheels[0].FullName --native work/build/bovary-cpu/bovary-infer.exe --work-dir work/ci-sdist-installed-check --output outputs/ci-sdist-installed-check.json
          if ($LASTEXITCODE -ne 0) { throw 'Rebuilt wheel isolated installed check failed' }
      - name: Prepare bounded consumer inputs without source or models
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem -LiteralPath work/ci-sdist-wheel -Filter *.whl)
          if ($wheels.Count -ne 1) { throw 'Expected one checked source-distribution wheel' }
          $wheel = $wheels[0]
          $bundle = New-Item -ItemType Directory -Path work/ci-consumer-inputs
          Copy-Item -LiteralPath $wheel.FullName -Destination $bundle.FullName
          Copy-Item -LiteralPath work/build/bovary-cpu/bovary-infer.exe -Destination $bundle.FullName
          Copy-Item -LiteralPath scripts/check_installed.py -Destination $bundle.FullName
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read candidate version' }
          $inputs = [ordered]@{
            version = $version.Trim()
            wheel = $wheel.Name
            wheel_sha256 = (Get-FileHash -LiteralPath $wheel.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            native = 'bovary-infer.exe'
            native_sha256 = (Get-FileHash -LiteralPath work/build/bovary-cpu/bovary-infer.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $inputs | ConvertTo-Json | Set-Content -LiteralPath work/ci-consumer-inputs/inputs.json -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; verified 2026-11-15
        with:
          name: bovary-consumer-inputs
          path: work/ci-consumer-inputs/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
  # A separate hosted image validates the artifacts without an editable checkout.
  # It still includes hosted-runner runtimes: this is not a clean desktop installer test.
  windows-installed-consumer:
    needs: windows-cpu
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2; verified 2026-11-15
        with:
          name: bovary-consumer-inputs
          path: ${{ runner.temp }}/bovary-consumer-inputs
          digest-mismatch: error
      - name: Check installed wheel, withdrawn GUI and native protocol without source
        shell: pwsh
        run: |
          Remove-Item Env:PYTHONPATH,Env:PYTHONHOME,Env:BOVARY_HOME -ErrorAction SilentlyContinue
          $bundle = Join-Path $env:RUNNER_TEMP 'bovary-consumer-inputs'
          $inputs = Get-Content -LiteralPath (Join-Path $bundle 'inputs.json') -Raw | ConvertFrom-Json
          python -I (Join-Path $bundle 'check_installed.py') --wheel (Join-Path $bundle $inputs.wheel) --native (Join-Path $bundle $inputs.native) --expected-version $inputs.version --wheel-sha256 $inputs.wheel_sha256 --native-sha256 $inputs.native_sha256 --work-dir (Join-Path $env:RUNNER_TEMP 'bovary installed consumer') --output (Join-Path $env:RUNNER_TEMP 'bovary-installed-consumer.json')
          if ($LASTEXITCODE -ne 0) { throw 'Fresh hosted-image consumer check failed' }
