[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bovary"
version = "0.2.0a16"
description = "Windows-first local inference workbench with controlled commercial routing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]

[project.scripts]
bovary = "bovary.cli:main"
bovary-settings = "bovary.gui:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
bovary = ["data/*.json"]
